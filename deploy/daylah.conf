# Replace DOMAIN with the verified production domain; configure TLS before release.
server {
 listen 80;
 server_name DOMAIN;
 root /opt/daylah/current/dist;
 index index.html;
 client_max_body_size 4k;
 # Do not log query strings or bearer tokens.
 access_log off;
 location ^~ /v1/ {
  proxy_pass http://127.0.0.1:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
 }
 location = /healthz { proxy_pass http://127.0.0.1:8080; }
 location ^~ /s/ {
  try_files /s/index.html =404;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control "no-store" always;
 }
 if ($args != "") { set $robots "noindex, nofollow"; }
 add_header X-Robots-Tag $robots always;
 location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
 location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
 location / {
  try_files $uri $uri/ =404;
  add_header Cache-Control "no-cache";
  # This location sets its own headers, so repeat the inherited indexing rule.
  add_header X-Robots-Tag $robots always;
 }
}
